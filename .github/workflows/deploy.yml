name: 更新資料並部署 GitHub Pages

on:
  push:
    branches: ["claude/0050-volume-analysis-1z4tw8"]
  schedule:
    - cron: "30 7 * * 1-5" # 台北時間 15:30（交易日收盤資料公布後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取證交所 0050 日成交資料
        run: node scripts/fetch_data.js

      - name: 抓取三大法人買賣超（增量累積）
        run: node scripts/fetch_inst.js

      - name: 抓取跨市場比較資料（美股/匯率/利率）
        run: node scripts/fetch_compare.js

      - name: 計算十年報酬對決（個股 vs 0050）
        run: node scripts/fetch_beat.js

      - name: 提交資料快照
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "更新 0050 資料快照"
            git push
          else
            echo "資料無變化，略過提交"
          fi

      - name: 組裝網站並部署到 gh-pages 分支
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/0050.json _site/data/
          cp data/0050_inst.json _site/data/ 2>/dev/null || echo '{"rows":[]}' > _site/data/0050_inst.json
          cp data/compare.json _site/data/ 2>/dev/null || echo '{"us":{},"fx":[],"dff":[],"dgs10":[]}' > _site/data/compare.json
          cp data/beat0050.json _site/data/ 2>/dev/null || echo '{"rows":[]}' > _site/data/beat0050.json
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "部署 ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
