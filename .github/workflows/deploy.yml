name: 更新資料並部署 GitHub Pages

on:
  push:
    branches: ["claude/0050-volume-analysis-1z4tw8"]
  schedule:
    - cron: "30 7 * * 1-5" # 台北時間 15:30（交易日收盤資料公布後）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取證交所 0050 日成交資料
        run: node scripts/fetch_data.js

      - name: 提交資料快照
        run: |
          if [ -n "$(git status --porcelain data/0050.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/0050.json
            git commit -m "更新 0050 資料快照"
            git push
          else
            echo "資料無變化，略過提交"
          fi

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/0050.json _site/data/

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
